name: hijri_calendar
description: بدر | badr — Hijri Calendar App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  uuid: ^4.4.2
  share_plus: ^10.0.0
  url_launcher: ^6.3.1
  intl: ^0.20.2
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  file_picker: ^8.1.4
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# flutter_launcher_icons generates Android launcher icons from
# assets/icon/icon.png. The CI workflow runs
# `dart run flutter_launcher_icons` after `flutter pub get`.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#0E4A2D"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
