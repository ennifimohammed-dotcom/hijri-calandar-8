name: hijri_calendar
description: بدر | badr — Hijri Calendar App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  uuid: ^4.4.2
  share_plus: ^10.0.0
  url_launcher: ^6.3.1
  intl: ^0.20.2
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  file_picker: ^8.1.4
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# flutter_launcher_icons generates every Android launcher density
# from the two sources below. The CI workflow runs
# `dart run flutter_launcher_icons` after `flutter pub get`.
#
#   image_path              -> the legacy square icon (API 23-25 and
#                              as a fallback). `icon.png` is the
#                              full-bleed green rounded-square art
#                              with the white background stripped to
#                              transparency.
#   adaptive_icon_foreground-> the API 26+ adaptive foreground layer.
#                              `icon_foreground.png` is the same art
#                              scaled to ~72% of the canvas with a
#                              transparent margin, so the launcher's
#                              circle / squircle / rounded mask never
#                              clips the gold calendar artwork.
#   adaptive_icon_background-> solid royal green sampled directly
#                              from the artwork (#153B1B) so the
#                              foreground square blends seamlessly
#                              into the background with no visible
#                              seam after masking.
#
# ios is intentionally false: there is no ios/ project folder — CI
# builds an Android APK only.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#153B1B"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
    - assets/icon/chabab_alkhair.jpg
    - assets/icon/splash_artwork.png
