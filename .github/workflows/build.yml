name: Build Flutter APK

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install ffmpeg (for notification sounds)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Create base Flutter project
        run: |
          flutter create \
            --org com.hijricalendar \
            --project-name hijri_calendar \
            --platforms android \
            /tmp/base_project

      - name: Inject Dart source code
        run: |
          rm -rf /tmp/base_project/lib
          cp -r $GITHUB_WORKSPACE/lib /tmp/base_project/
          cp $GITHUB_WORKSPACE/pubspec.yaml /tmp/base_project/pubspec.yaml
          # Ship the launcher-icon source asset so flutter_launcher_icons
          # can generate every density variant for the app icon, plus
          # the Chabab Al Khair association logo shown on the splash
          # screen and the welcome / onboarding flow.
          mkdir -p /tmp/base_project/assets/icon
          cp $GITHUB_WORKSPACE/assets/icon/icon.png /tmp/base_project/assets/icon/icon.png
          cp $GITHUB_WORKSPACE/assets/icon/icon_foreground.png /tmp/base_project/assets/icon/icon_foreground.png
          cp $GITHUB_WORKSPACE/assets/icon/chabab_alkhair.jpg /tmp/base_project/assets/icon/chabab_alkhair.jpg
          cp $GITHUB_WORKSPACE/assets/icon/splash_artwork.png /tmp/base_project/assets/icon/splash_artwork.png
          # Phase 1 — Safety Net: copy our test suite (and the
          # analysis_options.yaml at the repo root) into the staged
          # project so `flutter analyze` and `flutter test` run
          # against the same sources as `flutter build`.
          rm -rf /tmp/base_project/test
          if [ -d "$GITHUB_WORKSPACE/test" ]; then
            cp -r $GITHUB_WORKSPACE/test /tmp/base_project/test
          fi
          if [ -f "$GITHUB_WORKSPACE/analysis_options.yaml" ]; then
            cp $GITHUB_WORKSPACE/analysis_options.yaml /tmp/base_project/analysis_options.yaml
          fi

      - name: Replace Android build.gradle
        run: |
          if [ -f /tmp/base_project/android/app/build.gradle.kts ]; then
            echo "Replacing build.gradle.kts"
            cp $GITHUB_WORKSPACE/android_patches/build.gradle.kts /tmp/base_project/android/app/build.gradle.kts
            cat /tmp/base_project/android/app/build.gradle.kts
          elif [ -f /tmp/base_project/android/app/build.gradle ]; then
            echo "Replacing build.gradle"
            cp $GITHUB_WORKSPACE/android_patches/build.gradle /tmp/base_project/android/app/build.gradle
            cat /tmp/base_project/android/app/build.gradle
          else
            echo "ERROR: no gradle file"
            exit 1
          fi

      - name: Replace AndroidManifest.xml
        run: |
          MANIFEST_DEST=/tmp/base_project/android/app/src/main/AndroidManifest.xml
          cp $GITHUB_WORKSPACE/android_patches/AndroidManifest.xml "$MANIFEST_DEST"
          echo "----- AndroidManifest.xml -----"
          cat "$MANIFEST_DEST"

      - name: Inject Kotlin sources & home-screen widget resources
        run: |
          KOTLIN_DIR=/tmp/base_project/android/app/src/main/kotlin/com/hijricalendar/hijri_calendar
          mkdir -p "$KOTLIN_DIR"
          # Replace generated MainActivity.kt with our custom one
          rm -f "$KOTLIN_DIR/MainActivity.kt"
          cp $GITHUB_WORKSPACE/android_patches/kotlin/MainActivity.kt "$KOTLIN_DIR/MainActivity.kt"
          cp $GITHUB_WORKSPACE/android_patches/kotlin/BootReceiver.kt "$KOTLIN_DIR/BootReceiver.kt"
          # Home-screen widget providers.
          cp $GITHUB_WORKSPACE/android_patches/kotlin/HijriDateWidgetProvider.kt "$KOTLIN_DIR/HijriDateWidgetProvider.kt"
          cp $GITHUB_WORKSPACE/android_patches/kotlin/IslamicDayWidgetProvider.kt "$KOTLIN_DIR/IslamicDayWidgetProvider.kt"
          echo "----- Kotlin files -----"
          ls -la "$KOTLIN_DIR"
          # Merge the widget's Android resources (layout / xml /
          # strings) into the res/ tree `flutter create` generated.
          # File-by-file copy so we ADD to — never replace — that tree.
          RES_DIR=/tmp/base_project/android/app/src/main/res
          mkdir -p "$RES_DIR/layout" "$RES_DIR/xml" "$RES_DIR/values"
          cp $GITHUB_WORKSPACE/android_patches/res/layout/* "$RES_DIR/layout/"
          cp $GITHUB_WORKSPACE/android_patches/res/xml/*    "$RES_DIR/xml/"
          cp $GITHUB_WORKSPACE/android_patches/res/values/* "$RES_DIR/values/"
          echo "----- res/ tree -----"
          find "$RES_DIR" -type f | sort

      - name: Generate notification sound resources
        run: |
          RAW_DIR=/tmp/base_project/android/app/src/main/res/raw
          mkdir -p "$RAW_DIR"

          # Generate the 10 built-in notification tones via ffmpeg.
          # Each .ogg ships inside the APK at res/raw/<name>.ogg and
          # is referenced as RawResourceAndroidNotificationSound('<name>').
          # The `<name>` must match the `key` of NotificationSound in
          # lib/models/notification_settings.dart — rename one without
          # the other and the channel falls back to system default.

          # 1. Brightline — bright two-note chime (C6 → E6)
          ffmpeg -y -f lavfi -i "sine=frequency=1047:duration=0.18" \
            -f lavfi -i "sine=frequency=1319:duration=0.32" \
            -filter_complex "[0:a][1:a]concat=n=2:v=0:a=1,afade=t=out:st=0.45:d=0.05" \
            -ar 44100 -ac 1 "$RAW_DIR/brightline.ogg"

          # 2. Alpha — soft single tone with quick decay
          ffmpeg -y -f lavfi -i "sine=frequency=880:duration=0.55" \
            -af "afade=t=in:st=0:d=0.02,afade=t=out:st=0.4:d=0.15" \
            -ar 44100 -ac 1 "$RAW_DIR/alpha.ogg"

          # 3. Arrow — rising 3-tone arpeggio (E5 → G5 → B5)
          ffmpeg -y -f lavfi -i "sine=frequency=659:duration=0.12" \
            -f lavfi -i "sine=frequency=784:duration=0.12" \
            -f lavfi -i "sine=frequency=988:duration=0.20" \
            -filter_complex "[0:a][1:a][2:a]concat=n=3:v=0:a=1,afade=t=out:st=0.4:d=0.04" \
            -ar 44100 -ac 1 "$RAW_DIR/arrow.ogg"

          # 4. Chime — ascending G6 → C7 (4th interval, classic chime)
          ffmpeg -y -f lavfi -i "sine=frequency=1568:duration=0.15" \
            -f lavfi -i "sine=frequency=2093:duration=0.30" \
            -filter_complex "[0:a][1:a]concat=n=2:v=0:a=1,afade=t=out:st=0.40:d=0.05" \
            -ar 44100 -ac 1 "$RAW_DIR/chime.ogg"

          # 5. Bell — long sustained D5 with slow exponential fade
          ffmpeg -y -f lavfi -i "sine=frequency=587:duration=0.85" \
            -af "afade=t=in:st=0:d=0.02,afade=t=out:st=0.30:d=0.55" \
            -ar 44100 -ac 1 "$RAW_DIR/bell.ogg"

          # 6. Ping — very short, sharp A6 (1760 Hz)
          ffmpeg -y -f lavfi -i "sine=frequency=1760:duration=0.12" \
            -af "afade=t=in:st=0:d=0.01,afade=t=out:st=0.05:d=0.07" \
            -ar 44100 -ac 1 "$RAW_DIR/ping.ogg"

          # 7. Drop — descending pitch sweep (C6 → A5 → E5 → B4)
          ffmpeg -y -f lavfi -i "sine=frequency=1100:duration=0.07" \
            -f lavfi -i "sine=frequency=880:duration=0.07" \
            -f lavfi -i "sine=frequency=659:duration=0.07" \
            -f lavfi -i "sine=frequency=494:duration=0.12" \
            -filter_complex "[0:a][1:a][2:a][3:a]concat=n=4:v=0:a=1,afade=t=out:st=0.27:d=0.06" \
            -ar 44100 -ac 1 "$RAW_DIR/drop.ogg"

          # 8. Crystal — single bright D7 (2349 Hz), bell-like fade
          ffmpeg -y -f lavfi -i "sine=frequency=2349:duration=0.30" \
            -af "afade=t=in:st=0:d=0.01,afade=t=out:st=0.18:d=0.12" \
            -ar 44100 -ac 1 "$RAW_DIR/crystal.ogg"

          # 9. Pulse — tremolo'd A5 (10 Hz amp modulation = rapid beat)
          ffmpeg -y -f lavfi -i "sine=frequency=880:duration=0.45" \
            -af "tremolo=f=10:d=0.9,afade=t=out:st=0.4:d=0.05" \
            -ar 44100 -ac 1 "$RAW_DIR/pulse.ogg"

          # 10. Meadow — ascending major triad (C5 → E5 → G5)
          ffmpeg -y -f lavfi -i "sine=frequency=523:duration=0.12" \
            -f lavfi -i "sine=frequency=659:duration=0.12" \
            -f lavfi -i "sine=frequency=784:duration=0.20" \
            -filter_complex "[0:a][1:a][2:a]concat=n=3:v=0:a=1,afade=t=out:st=0.35:d=0.07" \
            -ar 44100 -ac 1 "$RAW_DIR/meadow.ogg"

          ls -la "$RAW_DIR"

      - name: Install dependencies
        working-directory: /tmp/base_project
        run: flutter pub get

      - name: Generate launcher icons
        working-directory: /tmp/base_project
        run: dart run flutter_launcher_icons

      # Phase 1 — Safety Net.
      # `flutter analyze` is run BEFORE `flutter build`: an analyzer
      # failure (lint warning, dead code, const-eval error, …)
      # blocks the APK build instead of being discovered minutes
      # later inside Gradle. `--no-fatal-infos` keeps purely
      # informational lints non-blocking; warnings and errors still
      # fail the job because `continue-on-error` is no longer set.
      - name: Analyze code (flutter analyze)
        working-directory: /tmp/base_project
        run: flutter analyze --no-fatal-infos

      # Phase 1 — Safety Net.
      # `flutter test` runs the unit-test suite. If the test/
      # directory is empty (which it is on first deploy) Flutter
      # returns 0 without failing, so this step is safe to keep
      # enabled from day one. Phase 3 lands real tests on top.
      - name: Run unit tests (flutter test)
        working-directory: /tmp/base_project
        run: flutter test --reporter compact

      - name: Build release APK
        working-directory: /tmp/base_project
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: badr-APK
          path: /tmp/base_project/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
