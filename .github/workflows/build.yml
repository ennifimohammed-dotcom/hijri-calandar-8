name: Build Flutter APK

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install ffmpeg (for notification sounds)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Create base Flutter project
        run: |
          flutter create \
            --org com.hijricalendar \
            --project-name hijri_calendar \
            --platforms android \
            /tmp/base_project

      - name: Inject Dart source code
        run: |
          rm -rf /tmp/base_project/lib
          cp -r $GITHUB_WORKSPACE/lib /tmp/base_project/
          cp $GITHUB_WORKSPACE/pubspec.yaml /tmp/base_project/pubspec.yaml
          # Ship the launcher-icon source asset so flutter_launcher_icons
          # can generate every density variant for the app icon, plus
          # the Chabab Al Khair association logo shown on the splash
          # screen and the welcome / onboarding flow.
          mkdir -p /tmp/base_project/assets/icon
          cp $GITHUB_WORKSPACE/assets/icon/icon.png /tmp/base_project/assets/icon/icon.png
          cp $GITHUB_WORKSPACE/assets/icon/chabab_alkhair.jpg /tmp/base_project/assets/icon/chabab_alkhair.jpg
          rm -rf /tmp/base_project/test

      - name: Replace Android build.gradle
        run: |
          if [ -f /tmp/base_project/android/app/build.gradle.kts ]; then
            echo "Replacing build.gradle.kts"
            cp $GITHUB_WORKSPACE/android_patches/build.gradle.kts /tmp/base_project/android/app/build.gradle.kts
            cat /tmp/base_project/android/app/build.gradle.kts
          elif [ -f /tmp/base_project/android/app/build.gradle ]; then
            echo "Replacing build.gradle"
            cp $GITHUB_WORKSPACE/android_patches/build.gradle /tmp/base_project/android/app/build.gradle
            cat /tmp/base_project/android/app/build.gradle
          else
            echo "ERROR: no gradle file"
            exit 1
          fi

      - name: Replace AndroidManifest.xml
        run: |
          MANIFEST_DEST=/tmp/base_project/android/app/src/main/AndroidManifest.xml
          cp $GITHUB_WORKSPACE/android_patches/AndroidManifest.xml "$MANIFEST_DEST"
          echo "----- AndroidManifest.xml -----"
          cat "$MANIFEST_DEST"

      - name: Inject Kotlin sources (MainActivity, BootReceiver)
        run: |
          KOTLIN_DIR=/tmp/base_project/android/app/src/main/kotlin/com/hijricalendar/hijri_calendar
          mkdir -p "$KOTLIN_DIR"
          # Replace generated MainActivity.kt with our custom one
          rm -f "$KOTLIN_DIR/MainActivity.kt"
          cp $GITHUB_WORKSPACE/android_patches/kotlin/MainActivity.kt "$KOTLIN_DIR/MainActivity.kt"
          cp $GITHUB_WORKSPACE/android_patches/kotlin/BootReceiver.kt "$KOTLIN_DIR/BootReceiver.kt"
          echo "----- Kotlin files -----"
          ls -la "$KOTLIN_DIR"

      - name: Generate notification sound resources
        run: |
          RAW_DIR=/tmp/base_project/android/app/src/main/res/raw
          mkdir -p "$RAW_DIR"

          # Generate three short, distinct notification tones via ffmpeg.
          # These ship inside the APK and are referenced as
          # RawResourceAndroidNotificationSound('brightline'|'alpha'|'arrow').

          # Brightline: bright two-note chime (C6 -> E6)
          ffmpeg -y -f lavfi -i "sine=frequency=1047:duration=0.18" \
            -f lavfi -i "sine=frequency=1319:duration=0.32" \
            -filter_complex "[0:a][1:a]concat=n=2:v=0:a=1,afade=t=out:st=0.45:d=0.05" \
            -ar 44100 -ac 1 "$RAW_DIR/brightline.ogg"

          # Alpha: soft single tone with quick decay
          ffmpeg -y -f lavfi -i "sine=frequency=880:duration=0.55" \
            -af "afade=t=in:st=0:d=0.02,afade=t=out:st=0.4:d=0.15" \
            -ar 44100 -ac 1 "$RAW_DIR/alpha.ogg"

          # Arrow: rising 3-tone arpeggio
          ffmpeg -y -f lavfi -i "sine=frequency=659:duration=0.12" \
            -f lavfi -i "sine=frequency=784:duration=0.12" \
            -f lavfi -i "sine=frequency=988:duration=0.20" \
            -filter_complex "[0:a][1:a][2:a]concat=n=3:v=0:a=1,afade=t=out:st=0.4:d=0.04" \
            -ar 44100 -ac 1 "$RAW_DIR/arrow.ogg"

          ls -la "$RAW_DIR"

      - name: Install dependencies
        working-directory: /tmp/base_project
        run: flutter pub get

      - name: Generate launcher icons
        working-directory: /tmp/base_project
        run: dart run flutter_launcher_icons

      - name: Analyze code
        working-directory: /tmp/base_project
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build release APK
        working-directory: /tmp/base_project
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: badr-APK
          path: /tmp/base_project/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
